services:
  postgres:
    image: postgres:16-alpine
    container_name: job-search-copilot-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_search_copilot
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: